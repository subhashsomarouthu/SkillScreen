name: Build and Deploy (Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login to ACR
        run: |
          set -e
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and Push Images (Self-Hosted)
        run: |
          set -e
          SERVICES="api-gateway user-service sso-service interview-service media-service audio-ai-service video-ai-service text-ai-service coding-service assessment-service notification-service orchestration-service common-service"
          for svc in $SERVICES; do
            echo "Building $svc..."
            docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/skillscreen/$svc:latest" "./backend/$svc"
            docker push "${{ secrets.ACR_LOGIN_SERVER }}/skillscreen/$svc:latest"
          done

      - name: Sync Env Files From VM
        run: |
          set -e
          SRC=/home/azureuser/SkillScreen/backend
          DEST="$GITHUB_WORKSPACE/backend"
          SERVICES="api-gateway user-service sso-service interview-service media-service audio-ai-service text-ai-service coding-service assessment-service notification-service orchestration-service common-service"
          for svc in $SERVICES; do
            if [ -f "$SRC/$svc/.env" ]; then
              mkdir -p "$DEST/$svc"
              cp "$SRC/$svc/.env" "$DEST/$svc/.env"
            else
              echo "Missing $SRC/$svc/.env" >&2
              exit 1
            fi
          done
          if [ -f "$SRC/video-ai-service/app/.env" ]; then
            mkdir -p "$DEST/video-ai-service/app"
            cp "$SRC/video-ai-service/app/.env" "$DEST/video-ai-service/app/.env"
          else
            echo "Missing $SRC/video-ai-service/app/.env" >&2
            exit 1
          fi

      - name: Deploy (Docker Compose)
        run: |
          set -e
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d

      - name: Cleanup Env Files
        if: always()
        run: |
          set -e
          DEST="$GITHUB_WORKSPACE/backend"
          SERVICES="api-gateway user-service sso-service interview-service media-service audio-ai-service text-ai-service coding-service assessment-service notification-service orchestration-service common-service"
          for svc in $SERVICES; do
            rm -f "$DEST/$svc/.env"
          done
          rm -f "$DEST/video-ai-service/app/.env"
